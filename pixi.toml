[workspace]
name = "3d-character-poseswap"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
jq = "*"
git = "*"

# The planner is Lean 4 (interactor-taskweft-persona) and needs elan on PATH.
[tasks.build-planner]
description = "Clone and build the persona_plan planner into .planner/"
cmd = "test -d .planner || git clone --depth 1 https://github.com/V-Sekai-fire/interactor-taskweft-persona.git .planner; cd .planner && lake build persona_plan"

[tasks.aux-goals]
description = "List the goals and composite methods of the AUX route"
cmd = "bash tools/aux.sh goals"

[tasks.aux-plan]
description = "Print the planner's steps for a goal or composite method"
args = [{ arg = "goal", default = "/aux/rigged" }, { arg = "problem", default = "problems/aux-route-ready.jsonld" }]
cmd = "bash tools/aux.sh plan {{ goal }} {{ problem }}"

[tasks.aux-run]
description = "Plan a goal or composite method, then run each step"
args = [{ arg = "goal", default = "/aux/rigged" }, { arg = "problem", default = "problems/aux-route-ready.jsonld" }]
cmd = "bash tools/aux.sh run {{ goal }} {{ problem }}"

[tasks.aux-action]
description = "Run one primitive action"
args = [{ arg = "name" }]
cmd = "bash tools/aux.sh action {{ name }}"

[tasks.aux-today]
description = "Plan the goal on today's desk; the planner refuses it (exit 3)"
cmd = "bash tools/aux.sh plan /aux/rigged problems/aux-route-2026-11-15.jsonld"

[tasks.goal-coco-relabelled]
description = "Composite or goal method /aux/coco_relabelled"
cmd = "bash tools/aux.sh run /aux/coco_relabelled"

[tasks.goal-synth-set]
description = "Composite or goal method /aux/synth_set"
cmd = "bash tools/aux.sh run /aux/synth_set"

[tasks.goal-part-detector]
description = "Composite or goal method /aux/part_detector"
